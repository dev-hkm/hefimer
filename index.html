<!doctype html>
<html lang="vi">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />

    <!-- ── Primary SEO ── -->
    <title>Hefimer – Share files & text in seconds</title>
    <meta name="description" content="Share files and text between any devices in seconds. No login required – just a 5-digit code. Files self-destruct after your timer expires." />
    <meta name="keywords" content="hefimer, file sharing, text sharing, ephemeral, temporary, 5-digit code, instant share, no login" />
    <meta name="author" content="Hefimer" />
    <meta name="robots" content="index, follow" />
    <link rel="canonical" href="https://hefimer.pages.dev" />

    <!-- ── Theme / PWA ── -->
    <meta name="theme-color" content="#000000" />
    <meta name="mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
    <meta name="apple-mobile-web-app-title" content="Hefimer" />

    <!-- ── Favicon ── -->
    <link rel="icon" type="image/svg+xml" href="/hefimer-orbit.svg" />
    <link rel="icon" type="image/png" sizes="512x512" href="/hefimer-orbit.png" />
    <link rel="apple-touch-icon" href="/hefimer-orbit.png" />
    <link rel="manifest" href="/manifest.json" />

    <!-- ── Open Graph (Facebook, Messenger, Zalo, Telegram, Discord) ── -->
    <meta property="og:type" content="website" />
    <meta property="og:site_name" content="Hefimer" />
    <meta property="og:title" content="Hefimer – Share files & text in seconds" />
    <meta property="og:description" content="Share files and text between any devices in seconds. No login required – just a 5-digit code. Files self-destruct after your timer expires." />
    <meta property="og:url" content="https://hefimer.pages.dev" />
    <meta property="og:image" content="https://hefimer.pages.dev/og-image.png" />
    <meta property="og:image:type" content="image/png" />
    <meta property="og:image:width" content="1200" />
    <meta property="og:image:height" content="630" />
    <meta property="og:image:alt" content="Hefimer – Share files and text in seconds" />
    <meta property="og:locale" content="vi_VN" />
    <meta property="og:locale:alternate" content="en_US" />

    <!-- ── Twitter / X Card ── -->
    <meta name="twitter:card" content="summary_large_image" />
    <meta name="twitter:site" content="@hefimer" />
    <meta name="twitter:creator" content="@hefimer" />
    <meta name="twitter:title" content="Hefimer – Share files & text in seconds" />
    <meta name="twitter:description" content="Share files and text between any devices in seconds. No login required – just a 5-digit code." />
    <meta name="twitter:image" content="https://hefimer.pages.dev/og-image.png" />
    <meta name="twitter:image:alt" content="Hefimer – Share files and text in seconds" />

    <!-- ── Telegram specific (uses OG tags, ensure they are set above) ── -->
    <!-- Telegram reads og:title, og:description, og:image automatically -->

    <!-- ── Discord specific ── -->
    <!-- Discord reads og:title, og:description, og:image + theme-color for embed color -->

    <!-- ── Fonts ── -->
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link href="https://fonts.googleapis.com/css2?family=Ubuntu:wght@300;400;500;700&display=swap" rel="stylesheet" />
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
    <script>
      if ('serviceWorker' in navigator) {
        window.addEventListener('load', () => {
          navigator.serviceWorker.register('/sw.js')
            .then(reg => console.log('SW Registered', reg))
            .catch(err => console.error('SW Registration Failed', err));
        });
      }
    </script>
  </body>
</html>
