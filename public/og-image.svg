<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="630" viewBox="0 0 1200 630">
  <defs>
    <radialGradient id="glow-left" cx="30%" cy="50%" r="45%">
      <stop offset="0%" stop-color="#1c1c1c"/>
      <stop offset="100%" stop-color="#000000"/>
    </radialGradient>
  </defs>

  <!-- Background -->
  <rect width="1200" height="630" fill="#000000"/>
  <rect width="1200" height="630" fill="url(#glow-left)"/>

  <!--
    Hefimer aperture logo — exact paths from /public/hefimer-orbit.svg
    Original viewBox: 0 0 128 128
    Centered at (270, 315), scaled to 220px → scale factor = 220/128 ≈ 1.718
    translate so that (64,64) maps to (270,315): tx = 270 - 64*1.718 = 270 - 109.9 = 160.1, ty = 315 - 64*1.718 = 315 - 109.9 = 205.1
  -->
  <g transform="translate(160, 205) scale(1.718)" fill="#ffffff" stroke="#111111" stroke-width="0.7" stroke-linejoin="round">
    <!-- Blade 1 (original) -->
    <path d="M64 15c25.4 0 46 20.6 46 46 0 7.8-2 15.4-5.7 22.1L84.7 71.7c1.1-2.6 1.7-5.4 1.7-8.3 0-12.3-10-22.3-22.3-22.3V15Z"/>
    <!-- Blade 2 (rotated 120°) -->
    <path d="M64 15c25.4 0 46 20.6 46 46 0 7.8-2 15.4-5.7 22.1L84.7 71.7c1.1-2.6 1.7-5.4 1.7-8.3 0-12.3-10-22.3-22.3-22.3V15Z" transform="rotate(120 64 64)"/>
    <!-- Blade 3 (rotated 240°) -->
    <path d="M64 15c25.4 0 46 20.6 46 46 0 7.8-2 15.4-5.7 22.1L84.7 71.7c1.1-2.6 1.7-5.4 1.7-8.3 0-12.3-10-22.3-22.3-22.3V15Z" transform="rotate(240 64 64)"/>
  </g>

  <!-- Vertical divider -->
  <line x1="490" y1="100" x2="490" y2="530" stroke="rgba(255,255,255,0.1)" stroke-width="1"/>

  <!-- RIGHT: Brand name -->
  <text x="545" y="268" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', system-ui, sans-serif" font-size="82" font-weight="900" fill="#ffffff" letter-spacing="-3">Hefimer</text>

  <!-- Tagline -->
  <text x="545" y="326" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', system-ui, sans-serif" font-size="24" font-weight="400" fill="rgba(255,255,255,0.45)">Share files &amp; text between</text>
  <text x="545" y="358" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', system-ui, sans-serif" font-size="24" font-weight="400" fill="rgba(255,255,255,0.45)">any devices in seconds.</text>

  <!-- Feature pills -->
  <rect x="545" y="390" width="128" height="30" rx="15" fill="rgba(255,255,255,0.07)" stroke="rgba(255,255,255,0.15)" stroke-width="1"/>
  <text x="609" y="410" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', system-ui, sans-serif" font-size="11" font-weight="700" fill="rgba(255,255,255,0.7)" text-anchor="middle" letter-spacing="1.5">SEND FILE</text>

  <rect x="685" y="390" width="130" height="30" rx="15" fill="rgba(255,255,255,0.07)" stroke="rgba(255,255,255,0.15)" stroke-width="1"/>
  <text x="750" y="410" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', system-ui, sans-serif" font-size="11" font-weight="700" fill="rgba(255,255,255,0.7)" text-anchor="middle" letter-spacing="1.5">SEND TEXT</text>

  <rect x="827" y="390" width="140" height="30" rx="15" fill="rgba(255,255,255,0.07)" stroke="rgba(255,255,255,0.15)" stroke-width="1"/>
  <text x="897" y="410" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', system-ui, sans-serif" font-size="11" font-weight="700" fill="rgba(255,255,255,0.7)" text-anchor="middle" letter-spacing="1.5">5-DIGIT CODE</text>

  <!-- URL -->
  <text x="545" y="500" font-family="'Courier New', Courier, monospace" font-size="15" font-weight="500" fill="rgba(255,255,255,0.25)" letter-spacing="0.5">hefimer.pages.dev</text>

  <!-- Outer border -->
  <rect x="1" y="1" width="1198" height="628" fill="none" stroke="rgba(255,255,255,0.05)" stroke-width="2"/>
</svg>
